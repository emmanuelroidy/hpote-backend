server.address=0.0.0.0
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:5000,http://127.0.0.1:5000}
app.media.upload-dir=${APP_MEDIA_UPLOAD_DIR:/tmp/hpote-uploads}
app.media.public-base-url=${APP_MEDIA_PUBLIC_BASE_URL:}
app.routing.base-url=${ROUTING_API_BASE_URL:https://valhalla1.openstreetmap.de}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
